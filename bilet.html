<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bilet al · CW PLAY Sinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e3a93b'/%3E%3Cpath d='M26 20 L46 32 L26 44 Z' fill='%23150f1d'/%3E%3C/svg%3E">
  <script src="js/ayarlar.js"></script>
  <script src="js/liste.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body data-sayfa="bilet" class="yukleniyor">
  <header class="top">
    <a class="brand" href="index.html"><span class="brand-cw">CW PLAY</span><span class="brand-sub">Sinema</span></a>
    <nav>
      <a href="index.html">Salon</a>
      <a class="btn btn-small" href="bilet.html">Bilet al</a>
    </nav>
  </header>
  <main id="icerik">
    <section class="box-office">
      <form id="bilet-form" class="ticket ticket-form" autocomplete="off">
        <div class="ticket-main">
          <h1>Bilet al</h1>
          <p class="muted-dark">Salondan koltuğunu seç, adını yaz ve biletini al.</p>

          <div class="screen-label" aria-hidden="true">Perde</div>
          <div id="koltuklar" class="seats" role="group" aria-label="Koltuk planı"></div>
          <p id="secilen" class="muted-dark">Henüz koltuk seçmedin.</p>

          <label class="code-label">Biletteki ad
            <input id="ad" maxlength="40" required placeholder="Adın ya da kullanıcı adın">
          </label>
          <label class="code-label" id="kod-alani">Bilet kodu
            <input id="kod" class="code" placeholder="XXXX-XXXX-XXXX" maxlength="16" spellcheck="false" autocapitalize="characters">
          </label>
          <p id="hata" class="form-error" role="alert" hidden></p>
          <button class="btn" type="submit">Bileti al</button>
        </div>
      </form>
      <div id="basili" class="printed-wrap" hidden></div>
    </section>

    <section class="row">
      <h2>Biletlerim</h2>
      <div id="biletlerim"></div>
    </section>
  </main>
  <footer class="foot">© 2026 Cold Works Production™ Media</footer>
</body>
</html>
